appId: com.nousresearch.hermes
# productName is now space-free so the Linux .deb installs to
# /opt/HermesOne/hermes-agent instead of `/opt/Hermes One/hermes-agent`.
# The previous path crashed Chromium's zygote on launch because
# argv[0] containing whitespace is forwarded verbatim into execvp and
# fails with EINVAL (SIGTRAP). See issue #877.
#
# The user-facing display name "Hermes One" is restored through
# `linux.desktop.entry.Name`, `nsis.shortcutName`, `nsis.uninstallDisplayName`,
# and `mac.extendInfo.CFBundleDisplayName` so end users see no change.
productName: HermesOne
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # ── Fork-specific excludes ─────────────────────────────────────────────
  # This checkout carries a second, unrelated Tauri application rooted at
  # src-tauri/. electron-builder packs the whole project by default, so its
  # Rust build cache (target/ alone: ~7.4 GB of .lib/.rlib) was riding along
  # inside app.asar and ballooning the installer to 7.7 GB for ~28 MB of
  # actual application code. None of it is loaded at runtime.
  - "!src-tauri/**"
  - "!third_party/**"
  - "!legacy-agenthub/**"
  - "!Temp/**"
  # Dev-only material: never read by the packaged app.
  - "!tests/**"
  - "!docs/**"
  - "!previews/**"
  - "!{lat.md,AGENTS.md,CLAUDE.md,CONTRIBUTING.md,CONTRIBUTING.*.md}"
  - "!{README.md,README.*.md,Development.md}"
  - "!{*.md,*.bat,*.ps1}"
  - "!{.husky,.github,.agents,.claude,.codex,.pi,.sandbox}/**"
  - "!*.tsbuildinfo"
  - "!{vite.config.ts,vitest.config.ts,tsconfig*.json}"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/prebuilds/*.node
win:
  executableName: hermes-agent
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # Restore user-facing installer / shortcut name now that productName is
  # space-free.
  shortcutName: Hermes One
  # Assisted installer so the user can pick the drive (e.g. E:\HermesOne).
  # oneClick was the upstream default; this fork installs on machines where
  # C: space matters, so the directory page is enabled deliberately.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  # Keep the existing bundle/executable name used by updates and release checks.
  executableName: Hermes One
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - CFBundleDisplayName: Hermes One
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: Nous Research
  category: Utility
  synopsis: Self-improving AI assistant desktop app
  description: >-
    Hermes One is a native desktop app for installing, configuring, and chatting
    with Hermes Agent — a self-improving AI assistant with tool use, multi-platform
    messaging, and a closed learning loop.
  # Override the user-facing .desktop display name (default would now be
  # "HermesOne" since productName is space-free). See issue #877.
  desktop:
    entry:
      Name: Hermes One
      Comment: Hermes One — self-improving AI assistant desktop app
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false

# Auto-update feed. This fork MUST NOT inherit upstream's release channel:
# pointing at fathah/hermes-desktop would make the updater download vanilla
# Hermes One and silently replace this build, wiping every AgentHub feature.
# Our own releases feed the updater instead; until one is published the check
# finds nothing, which the app treats as "no update" rather than an error.
publish:
  provider: github
  owner: TANGZZee
  repo: agenthub-desktop
